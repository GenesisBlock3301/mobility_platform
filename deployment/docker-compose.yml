name: mobility-platform

services:
  db:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<version>.
      - pgdata:/var/lib/postgresql
      - ../backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    # No published port: only services on this network can reach the database.

  migrate:
    build:
      context: ../backend
      target: runtime
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../backend
      target: runtime
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
    ports:
      # Published on this machine only, so the assessor can open the API docs.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: ../frontend
    environment:
      API_URL: http://api:8000/api/v1
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # The local demo runs over plain HTTP, so the cookie cannot be marked Secure.
      # Remove this line when serving over HTTPS.
      COOKIE_SECURE: "false"
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      # Bound to this machine only: the local demo runs over plain HTTP.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # Test runner: docker compose --profile test run --rm api-test
  api-test:
    profiles: ["test"]
    build:
      context: ../backend
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
      DATABASE_URL: postgresql+asyncpg://unused:unused@db:5432/unused
      INTERNAL_TOKEN: test-internal-token-123456
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
